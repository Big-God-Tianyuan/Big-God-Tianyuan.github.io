<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>兴趣与生活 · Tianyuan Yang</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #61677a;
      --accent: #2d5cf6;
      --accent-soft: rgba(45, 92, 246, 0.12);
      --border: #e5e7ef;
      --shadow: 0 24px 50px rgba(31, 36, 48, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #eef1ff 0%, #f7f7fb 35%, #ffffff 100%);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      padding: 32px 0 24px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .nav-links a {
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .nav-links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .hero {
      margin: 32px 0 24px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px 32px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .hero h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 64px;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 24px rgba(31, 36, 48, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: -40% -30% auto auto;
      width: 140px;
      height: 140px;
      background: rgba(45, 92, 246, 0.12);
      border-radius: 50%;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 26px rgba(31, 36, 48, 0.08);
    }

    .card h3 {
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .photo-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .photo {
      height: 90px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffd6e8, #c2ccff);
      display: grid;
      place-items: center;
      color: rgba(31, 36, 48, 0.6);
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    footer {
      padding: 24px 0 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <div class="brand">Tianyuan Yang · Life</div>
      <div class="nav-links">
        <a href="index.html">返回首页</a>
        <a href="publications.html">论文</a>
        <a href="teaching.html">教学与活动</a>
      </div>
    </nav>
    <div class="hero">
      <h1>兴趣与生活</h1>
      <p>用另一面记录学术之外的灵感、阅读与旅途。</p>
      <div class="photo-strip">
        <div class="photo">城市漫步</div>
        <div class="photo">阅读时刻</div>
        <div class="photo">咖啡与音乐</div>
        <div class="photo">山野远足</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="grid">
      <div class="card">
        <h3>阅读清单</h3>
        <p>社会学、心理学与科幻文学交叉的阅读路径，记录新的研究灵感。</p>
      </div>
      <div class="card">
        <h3>城市观察</h3>
        <p>在城市行走中记录人与技术互动的小故事，作为教学案例素材。</p>
      </div>
      <div class="card">
        <h3>摄影与视觉</h3>
        <p>用镜头记录实验室生活、会议与旅行中的瞬间。</p>
      </div>
      <div class="card">
        <h3>健康与运动</h3>
        <p>保持长跑与力量训练习惯，让研究保持可持续节奏。</p>
      </div>
    </section>
  </main>

  <footer>
    © 2025 Tianyuan Yang · Life & Inspiration
  </footer>
</body>
</html>
